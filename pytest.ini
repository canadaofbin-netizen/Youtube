[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    integration: reads live project data under BCI_Shorts_Channel (skipped unless -m integration)
    slow: full-length 3-minute 1080x1920 end-to-end video encode tests (run with -m slow)
addopts = -m "not integration and not slow"
filterwarnings =
    ignore::DeprecationWarning
